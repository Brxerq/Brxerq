# Redraws the contribution animation in README.md once a day.
name: activity

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/activity.yml]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/activity-dark.svg?color_snake=#ffc24a&color_dots=#151b2c,#17244f,#2444a8,#5b84f7,#c3d4ff
            dist/activity-light.svg?color_snake=#e8930c&color_dots=#f0f3fa,#c9d8ff,#93aefc,#456fea,#1b3896

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
