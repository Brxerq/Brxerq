# Redraws the contribution animation in README.md once a day.
name: activity

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/activity.yml]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/activity-dark.svg?color_snake=#ffd23f&color_dots=#0b0d15,#3b3414,#7a6519,#c9a32c,#ffd23f
            dist/activity-light.svg?color_snake=#05060a&color_dots=#e3ded2,#e9d79a,#e8c55a,#d9ac1f,#05060a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
